<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>Ideas · nested</title>
  <style>
    /* reset & base */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    :root {
      --bg: #0C0C0C;
      --box: #D9D9D9;
      --box-done: #5c6b5f;
      --btn: #434343;
      --btn-hover: #565656;
      --text: #FFFFFF;
      --text-dim: rgba(255,255,255,0.5);
      --danger: #8a3b3b;
      --border-subtle: #262626;
    }
    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      min-height: 100vh;
      margin: 0;
      padding: 0;
    }
    /* big canvas: zoomable, no crop, overflow visible */
    .page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 24px 100px;
      min-height: 100vh;
      width: 100%;
      overflow: visible;   /* allow words to flow */
    }

    h1 {
      font-weight: 400;
      font-size: clamp(32px, 7vw, 64px);
      letter-spacing: -0.05em;
      text-transform: uppercase;
      margin: 0 0 40px 0;
      line-height: 1.1;
      word-break: break-word;
    }

    /* ----- lists ----- */
    ul.idea-list {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    ul.idea-list ul.idea-list {
      margin-top: 14px;
      margin-left: 16px;
      padding-left: 28px;
      border-left: 1px solid var(--border-subtle);
    }
    li.idea {
      margin-bottom: 14px;
      width: 100%;
    }

    /* row: checkbox + text + actions */
    .idea-row {
      display: flex;
      align-items: center;
      gap: 12px;          /* reduced from 20px */
      flex-wrap: nowrap;
      width: 100%;
    }

    /* smaller checkbox */
    .checkbox {
      flex: 0 0 28px;      /* smaller: 28x28 */
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: var(--box);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s ease;
      flex-shrink: 0;
    }
    .checkbox.done {
      background: var(--box-done);
    }
    .checkbox svg {
      width: 16px;        /* smaller icon */
      height: 16px;
      opacity: 0;
      transition: opacity 0.15s ease;
      display: block;
    }
    .checkbox.done svg {
      opacity: 1;
    }

    /* text: flexible, wraps naturally, no crop */
    .idea-text {
      flex: 1 1 auto;
      font-size: clamp(18px, 3.2vw, 30px);
      line-height: 1.2;
      word-break: break-word;
      overflow-wrap: break-word;
      min-width: 0;       /* prevent overflow */
      cursor: default;
      padding-right: 4px;
    }
    .idea-text.done {
      text-decoration: line-through;
      color: var(--text-dim);
    }

    /* action buttons */
    .row-actions {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    .icon-btn {
      flex: none;
      width: 26px;
      height: 26px;
      border-radius: 8px;
      background: var(--btn);
      border: none;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 16px;
      padding: 0;
      transition: background 0.15s ease;
    }
    .icon-btn:hover {
      background: var(--btn-hover);
    }
    .icon-btn.delete-btn:hover {
      background: var(--danger);
    }
    .icon-btn svg {
      width: 14px;
      height: 14px;
      display: block;
    }

    /* inline add (sub-idea) */
    .inline-add {
      display: none;
      margin-top: 8px;
      padding-left: 40px;   /* aligned under checkbox */
    }
    .inline-add.open {
      display: flex;
      gap: 8px;
    }
    .inline-add input {
      flex: 1;
      background: transparent;
      border: none;
      border-bottom: 2px solid var(--btn);
      color: var(--text);
      font-family: inherit;
      font-size: 18px;
      padding: 4px 2px;
      outline: none;
      min-width: 80px;
    }
    .inline-add input::placeholder {
      color: var(--text-dim);
    }
    .inline-add input:focus {
      border-bottom-color: #888;
    }

    /* root add form */
    .add-root-form {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px 20px;
      gap: 16px;
      background: var(--btn);
      border-radius: 10px;
      margin-top: 40px;
      max-width: 480px;
      width: 100%;
    }
    .add-root-form input {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text);
      font-family: inherit;
      font-size: clamp(18px, 3.2vw, 30px);
      outline: none;
      min-width: 60px;
    }
    .add-root-form input::placeholder {
      color: var(--text-dim);
    }
    .empty-hint {
      color: var(--text-dim);
      font-size: 18px;
      margin: 16px 0 0;
    }

    /* delete-all button */
    .danger-zone {
      margin-top: 32px;
      display: flex;
      justify-content: flex-start;
    }
    .delete-all-btn {
      background: var(--danger);
      border: none;
      color: white;
      font-size: 18px;
      padding: 10px 24px;
      border-radius: 30px;
      font-weight: 500;
      letter-spacing: 0.3px;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.1s ease;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      font-family: inherit;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .delete-all-btn:hover {
      background: #a04545;
    }
    .delete-all-btn:active {
      transform: scale(0.97);
    }
    .delete-all-btn svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* ensure no overflow cut */
    .page, .idea-row, .idea-text {
      overflow: visible !important;
    }
    li.idea {
      overflow: visible;
    }
    /* on very small screens, keep spacing */
    @media (max-width: 480px) {
      .page { padding: 24px 16px 80px; }
      .checkbox { flex: 0 0 24px; width: 24px; height: 24px; }
      .checkbox svg { width: 14px; height: 14px; }
      .idea-row { gap: 8px; }
      .row-actions { gap: 4px; }
      .icon-btn { width: 22px; height: 22px; }
      .icon-btn svg { width: 12px; height: 12px; }
      .inline-add { padding-left: 28px; }
      .delete-all-btn { font-size: 16px; padding: 8px 18px; }
    }
  </style>
</head>
<body>
<div class="page">
  <h1>Ideas ?? write them down</h1>
  <ul class="idea-list" id="root-list"></ul>
  <p class="empty-hint" id="empty-hint">No ideas yet. Add the first one below.</p>

  <form class="add-root-form" id="add-root-form">
    <input type="text" id="add-root-input" placeholder="add new idea" autocomplete="off">
  </form>

  <!-- delete all button -->
  <div class="danger-zone">
    <button class="delete-all-btn" id="delete-all-btn">
      <svg viewBox="0 0 24 24"><path d="M4 7H20M9 7V4H15V7M6 7L7 20H17L18 7"/></svg>
      Delete all
    </button>
  </div>
</div>

<script>
  (function() {
    const STORAGE_KEY = "nested-ideas-v1";

    function loadIdeas() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return [];
        const parsed = JSON.parse(raw);
        return Array.isArray(parsed) ? parsed : [];
      } catch (e) {
        console.error("Could not load ideas", e);
        return [];
      }
    }

    function saveIdeas() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(ideas));
      } catch (e) {
        console.error("Could not save ideas", e);
      }
    }

    let ideas = loadIdeas();

    function makeId() {
      return 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8);
    }

    function findNode(list, id) {
      for (const node of list) {
        if (node.id === id) return node;
        const found = findNode(node.children, id);
        if (found) return found;
      }
      return null;
    }

    function findParentArray(list, id, parentArr) {
      for (const node of list) {
        if (node.id === id) return parentArr;
        const found = findParentArray(node.children, id, node.children);
        if (found) return found;
      }
      return null;
    }

    function addIdea(parentArray, text) {
      const trimmed = text.trim();
      if (!trimmed) return;
      parentArray.push({
        id: makeId(),
        text: trimmed,
        done: false,
        children: []
      });
      saveIdeas();
      render();
    }

    function toggleDone(id) {
      const node = findNode(ideas, id);
      if (node) {
        node.done = !node.done;
        saveIdeas();
        render();
      }
    }

    function deleteIdea(id) {
      const parentArr = findParentArray(ideas, id, ideas);
      if (parentArr) {
        const idx = parentArr.findIndex(n => n.id === id);
        if (idx !== -1) {
          parentArr.splice(idx, 1);
          saveIdeas();
          render();
        }
      }
    }

    // delete everything
    function deleteAll() {
      if (ideas.length === 0) return;
      if (confirm('Delete all ideas and sub-ideas?')) {
        ideas = [];
        saveIdeas();
        render();
      }
    }

    const CHECK_SVG = '<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4 12.5L9.5 18L20 6" stroke="#0C0C0C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    const PLUS_SVG = '<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 4V20M4 12H20" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/></svg>';
    const TRASH_SVG = '<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4 7H20M9 7V4H15V7M6 7L7 20H17L18 7" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

    function buildIdeaLi(node) {
      const li = document.createElement('li');
      li.className = 'idea';
      li.dataset.id = node.id;

      const row = document.createElement('div');
      row.className = 'idea-row';

      const checkbox = document.createElement('div');
      checkbox.className = 'checkbox' + (node.done ? ' done' : '');
      checkbox.innerHTML = CHECK_SVG;
      checkbox.title = 'Mark as done';
      checkbox.addEventListener('click', () => toggleDone(node.id));

      const textEl = document.createElement('span');
      textEl.className = 'idea-text' + (node.done ? ' done' : '');
      textEl.textContent = node.text;

      const actions = document.createElement('div');
      actions.className = 'row-actions';

      const addBtn = document.createElement('button');
      addBtn.type = 'button';
      addBtn.className = 'icon-btn add-btn';
      addBtn.innerHTML = PLUS_SVG;
      addBtn.title = 'Add sub-idea';

      const delBtn = document.createElement('button');
      delBtn.type = 'button';
      delBtn.className = 'icon-btn delete-btn';
      delBtn.innerHTML = TRASH_SVG;
      delBtn.title = 'Delete';
      delBtn.addEventListener('click', () => deleteIdea(node.id));

      actions.appendChild(addBtn);
      actions.appendChild(delBtn);

      row.appendChild(checkbox);
      row.appendChild(textEl);
      row.appendChild(actions);
      li.appendChild(row);

      // Inline add field (sub-idea)
      const inlineAdd = document.createElement('div');
      inlineAdd.className = 'inline-add';
      const inlineInput = document.createElement('input');
      inlineInput.type = 'text';
      inlineInput.placeholder = 'Write sub-idea and press Enter';
      inlineInput.autocomplete = 'off';
      inlineAdd.appendChild(inlineInput);
      li.appendChild(inlineAdd);

      addBtn.addEventListener('click', () => {
        const isOpen = inlineAdd.classList.toggle('open');
        if (isOpen) {
          inlineInput.value = '';
          inlineInput.focus();
        }
      });

      inlineInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          addIdea(node.children, inlineInput.value);
          inlineAdd.classList.remove('open');
        } else if (e.key === 'Escape') {
          inlineAdd.classList.remove('open');
        }
      });

      // Children
      if (node.children.length > 0) {
        const childUl = document.createElement('ul');
        childUl.className = 'idea-list children';
        node.children.forEach(child => {
          childUl.appendChild(buildIdeaLi(child));
        });
        li.appendChild(childUl);
      }

      return li;
    }

    function render() {
      const rootList = document.getElementById('root-list');
      const emptyHint = document.getElementById('empty-hint');
      rootList.innerHTML = '';
      if (ideas.length === 0) {
        emptyHint.style.display = 'block';
      } else {
        emptyHint.style.display = 'none';
        ideas.forEach(node => {
          rootList.appendChild(buildIdeaLi(node));
        });
      }
    }

    // root add form
    const addRootForm = document.getElementById('add-root-form');
    const addRootInput = document.getElementById('add-root-input');
    addRootForm.addEventListener('submit', (e) => {
      e.preventDefault();
      addIdea(ideas, addRootInput.value);
      addRootInput.value = '';
      addRootInput.focus();
    });

    // delete all button
    document.getElementById('delete-all-btn').addEventListener('click', deleteAll);

    render();
  })();
</script>
</body>
</html>
